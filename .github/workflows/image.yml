name: Image

# Publishes the Docker image to GitHub Container Registry, so running Eco is `docker compose pull`, not a build.
#   ghcr.io/<owner>/eco:1.12.0, :1.12, :1 and :latest (the newest release only)
# CI calls it after each release. Every Monday it builds the newest release again, because the image carries yt-dlp,
# which has to change whenever YouTube does. It can also be run by hand for any release.
on:
  workflow_call:
    inputs:
      version:
        description: Release tag to publish, e.g. v1.12.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish (empty for the newest release)
        type: string
        required: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - id: release
        name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
        run: |
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          tag=${WANTED:-$newest}
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a release tag: $tag" >&2
            exit 1
          fi
          # An older release never takes :latest from the newest one
          {
            echo "tag=$tag"
            echo "latest=$([ "$tag" = "$newest" ] && echo true || echo false)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eco"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.latest }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.latest }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
          labels: |
            org.opencontainers.image.title=Eco
            org.opencontainers.image.description=Self-hosted music app: plays a Navidrome library, searches a catalogue and downloads what is missing.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }} # a fresh yt-dlp, not the cached layer
          build-args: VERSION=${{ steps.release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
