name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eco:ci .
      - run: docker run --rm eco:ci version

  # The desktop app's Rust side (desktop/, docs/desktop.md): formatting, lints and tests. It builds against WebKitGTK.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: make desktop-check

  # Every feature or fix that reaches main becomes a release, once the checks above pass. The version comes from the
  # commit messages: fix: is a patch, feat: a minor version, a breaking change the major one. See CONTRIBUTING.md.
  release:
    needs: [check, docker, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag semantic-release put on this commit, if this push made a release. A tag pushed with GITHUB_TOKEN starts
      # no workflow by itself, so the image is published from here.
      - id: released
        run: |
          tag=$(git ls-remote --tags origin 'v*' | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | head -n 1)
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}

  # The desktop app's installers and its update list, attached to the same release (.github/workflows/desktop.yml)
  installers:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
