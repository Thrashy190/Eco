name: eco
description: "Eco for phones: your Navidrome library, played natively."
publish_to: 'none'

# The version shown on the phone. Keep it in step with the release of Eco it was built with.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  background_downloader: ^9.6.6
  cached_network_image: ^4.0.7
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
