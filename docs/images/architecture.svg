<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="title desc">
  <title id="title">How Eco fits together</title>
  <desc id="desc">Phones, computers and Subsonic apps reach Eco over HTTPS. Eco passes audio and library requests to Navidrome, asks MusicBrainz and iTunes for song information, and downloads songs with yt-dlp and ffmpeg into the music folder that Navidrome reads.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1f2430"/></pattern>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9f8d9"/><stop offset="1" stop-color="#3fd0a2"/></linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="a-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3fd0a2"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ea8fe"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f5b65b"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b93a7"/></marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 22px; font-weight: 700; fill: #f2f4f8; }
    .sub { font-size: 14px; fill: #8b93a7; }
    .group { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #8b93a7; }
    .t { font-size: 15px; font-weight: 650; fill: #f2f4f8; }
    .d { font-size: 12.5px; fill: #a4abbc; }
    .label { font-size: 12px; font-weight: 600; }
    .card { fill: #181b24; stroke: #2c3240; stroke-width: 1.2; filter: url(#lift); }
    .box { fill: none; stroke: #2c3240; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .edge { fill: none; stroke-width: 2; stroke-linejoin: round; }
    .mint { stroke: #3fd0a2; } .blue { stroke: #6ea8fe; } .amber { stroke: #f5b65b; } .grey { stroke: #8b93a7; }
    .fmint { fill: #3fd0a2; } .fblue { fill: #6ea8fe; } .famber { fill: #f5b65b; } .fgrey { fill: #a4abbc; }
    .tag { fill: #0e1016; }
  </style>

  <rect width="1280" height="780" rx="24" fill="#0e1016"/>
  <rect width="1280" height="780" rx="24" fill="url(#dots)"/>

  <text x="40" y="52" class="h">How Eco fits together</text>
  <text x="40" y="76" class="sub">Your devices talk to one server. Navidrome keeps the library, Eco adds search, downloads and the app.</text>

  <!-- Devices -->
  <rect x="32" y="104" width="248" height="596" rx="16" class="box"/>
  <text x="50" y="132" class="group">YOUR DEVICES</text>

  <rect x="50" y="148" width="212" height="176" rx="12" class="card"/>
  <text x="68" y="178" class="t">Phone</text>
  <text x="68" y="198" class="d">Installed from the browser,</text>
  <text x="68" y="214" class="d">lock-screen controls</text>
  <rect x="68" y="232" width="176" height="74" rx="9" fill="#10231e" stroke="#3fd0a2" stroke-width="1.2"/>
  <text x="82" y="256" font-size="13.5" font-weight="650" fill="#a9f8d9">Saved songs</text>
  <text x="82" y="274" class="d">In the app's own storage.</text>
  <text x="82" y="291" class="d">They play with no request.</text>

  <rect x="50" y="356" width="212" height="128" rx="12" class="card"/>
  <text x="68" y="396" class="t">Computer or tablet</text>
  <text x="68" y="416" class="d">Panels: library, page,</text>
  <text x="68" y="432" class="d">player bar, what plays next</text>

  <rect x="50" y="516" width="212" height="128" rx="12" class="card"/>
  <text x="68" y="556" class="t">Any Subsonic app</text>
  <text x="68" y="576" class="d">Optional. Sees the same library</text>
  <text x="68" y="592" class="d">through Navidrome's own API</text>

  <!-- HTTPS -->
  <rect x="316" y="148" width="46" height="552" rx="12" fill="#14171f" stroke="#2c3240" stroke-width="1.2"/>
  <text transform="translate(345 424) rotate(-90)" text-anchor="middle" class="d" font-weight="600">HTTPS: Cloudflare Tunnel, Tailscale or your own proxy</text>

  <path d="M262 236H316" class="edge grey" marker-end="url(#a-grey)"/>
  <path d="M262 420H316" class="edge grey" marker-end="url(#a-grey)"/>
  <path d="M262 580H316" class="edge grey" marker-end="url(#a-grey)"/>

  <!-- eco -->
  <rect x="400" y="104" width="372" height="596" rx="16" fill="#12151c" stroke="#3fd0a2" stroke-width="1.6"/>
  <g transform="translate(420 118) scale(.0625)"><rect width="512" height="512" rx="112" fill="#08080c"/><g fill="url(#mint)"><rect x="94" y="175" width="30" height="163" rx="15"/><rect x="136" y="125" width="30" height="263" rx="15"/><rect x="178" y="101" width="30" height="86" rx="15"/><rect x="178" y="229" width="30" height="55" rx="15"/><rect x="178" y="326" width="30" height="86" rx="15"/><rect x="220" y="90" width="30" height="75" rx="15"/><rect x="220" y="229" width="30" height="55" rx="15"/><rect x="220" y="348" width="30" height="75" rx="15"/><rect x="262" y="90" width="30" height="75" rx="15"/><rect x="262" y="229" width="30" height="55" rx="15"/><rect x="262" y="348" width="30" height="75" rx="15"/><rect x="304" y="101" width="30" height="86" rx="15"/><rect x="304" y="229" width="30" height="55" rx="15"/><rect x="304" y="326" width="30" height="86" rx="15"/><rect x="346" y="125" width="30" height="159" rx="15"/><rect x="346" y="351" width="30" height="37" rx="15"/><rect x="388" y="175" width="30" height="109" rx="15"/></g></g>
  <text x="464" y="134" font-size="18" font-weight="700" fill="#f2f4f8">Eco</text>
  <text x="464" y="152" class="d">One Go binary with the app inside</text>

  <rect x="420" y="172" width="332" height="80" rx="12" class="card"/>
  <text x="438" y="204" class="t">The web app</text>
  <text x="438" y="224" class="d">React and TypeScript, built into the binary</text>

  <rect x="420" y="268" width="332" height="80" rx="12" class="card"/>
  <text x="438" y="300" class="t">/rest/*</text>
  <text x="438" y="320" class="d">Audio, covers, playlists: passed straight on</text>

  <rect x="420" y="364" width="332" height="96" rx="12" class="card"/>
  <text x="438" y="396" class="t">/api/*</text>
  <text x="438" y="416" class="d">Search everywhere, whole albums, imported lists,</text>
  <text x="438" y="433" class="d">library clean-up, control of your other devices</text>

  <rect x="420" y="476" width="332" height="96" rx="12" class="card"/>
  <text x="438" y="508" class="t">Download queue</text>
  <text x="438" y="528" class="d">One song at a time. Refuses a doubtful match,</text>
  <text x="438" y="545" class="d">pauses when YouTube blocks</text>

  <rect x="420" y="588" width="332" height="92" rx="12" class="card"/>
  <text x="438" y="620" class="t">Per-user data</text>
  <text x="438" y="640" class="d">Recents, pins, covers, imported lists.</text>
  <text x="438" y="657" class="d">No database, and no user sees another's</text>

  <path d="M362 212H420" class="edge grey" marker-end="url(#a-grey)"/>
  <path d="M362 308H420" class="edge mint" marker-end="url(#a-mint)"/>
  <path d="M362 412H420" class="edge blue" marker-end="url(#a-blue)"/>
  <path d="M362 524H420" class="edge amber" marker-end="url(#a-amber)"/>

  <!-- Right column -->
  <text x="852" y="132" class="group">THE LIBRARY</text>
  <rect x="852" y="148" width="388" height="84" rx="12" class="card"/>
  <text x="870" y="180" class="t">Navidrome</text>
  <text x="870" y="200" class="d">Accounts, playlists, favorites, play counts, streaming</text>

  <!-- Music folder, as a cylinder -->
  <g filter="url(#lift)">
    <path d="M852 278v44c0 11 87 20 194 20s194-9 194-20v-44z" fill="#181b24" stroke="#2c3240" stroke-width="1.2"/>
    <ellipse cx="1046" cy="278" rx="194" ry="20" fill="#20242f" stroke="#2c3240" stroke-width="1.2"/>
  </g>
  <text x="1046" y="284" text-anchor="middle" class="t">data/music</text>
  <text x="1046" y="322" text-anchor="middle" class="d">Your files. Navidrome only reads them; Eco writes downloads</text>

  <text x="852" y="376" class="group">SONG INFORMATION</text>
  <rect x="842" y="386" width="408" height="118" rx="14" class="box"/>
  <rect x="852" y="396" width="186" height="98" rx="12" class="card"/>
  <text x="868" y="427" class="t">MusicBrainz</text>
  <text x="868" y="447" class="d">Main catalogue, with the</text>
  <text x="868" y="464" class="d">Cover Art Archive</text>
  <rect x="1054" y="396" width="186" height="98" rx="12" class="card"/>
  <text x="1070" y="427" class="t">iTunes Search</text>
  <text x="1070" y="447" class="d">Backup, and a second</text>
  <text x="1070" y="464" class="d">opinion on every search</text>

  <text x="852" y="532" class="group">DOWNLOADING</text>
  <rect x="852" y="548" width="168" height="92" rx="12" class="card"/>
  <text x="868" y="578" class="t">yt-dlp</text>
  <text x="868" y="598" class="d">Finds the audio on</text>
  <text x="868" y="615" class="d">YouTube, fetches it</text>
  <rect x="1072" y="548" width="168" height="92" rx="12" class="card"/>
  <text x="1088" y="578" class="t">ffmpeg</text>
  <text x="1088" y="598" class="d">Tags and cover,</text>
  <text x="1088" y="615" class="d">no re-encoding</text>

  <!-- Connections on the right -->
  <path d="M752 308H806Q812 308 812 302V196Q812 190 818 190H852" class="edge mint" marker-end="url(#a-mint)"/>
  <path d="M1046 232V256" class="edge mint" marker-end="url(#a-mint)"/>
  <path d="M752 412H842" class="edge blue" marker-end="url(#a-blue)"/>
  <path d="M752 524H812Q818 524 818 530V588Q818 594 824 594H852" class="edge amber" marker-end="url(#a-amber)"/>
  <path d="M1020 594H1072" class="edge amber" marker-end="url(#a-amber)"/>
  <path d="M1240 594H1254Q1260 594 1260 588V306Q1260 300 1254 300H1242" class="edge amber" marker-end="url(#a-amber)"/>

  <!-- Labels on the lines -->
  <rect x="770" y="232" width="84" height="20" rx="5" class="tag"/>
  <text x="812" y="246" text-anchor="middle" class="label fmint">library, audio</text>
  <rect x="1056" y="238" width="44" height="18" rx="5" class="tag"/>
  <text x="1078" y="251" text-anchor="middle" class="label fmint">reads</text>
  <rect x="1224" y="436" width="72" height="20" rx="5" class="tag" transform="rotate(-90 1260 446)"/>
  <text transform="translate(1264 446) rotate(-90)" text-anchor="middle" class="label famber">tagged file</text>

  <!-- Legend -->
  <g transform="translate(40 738)">
    <path d="M0 0H30" class="edge mint" marker-end="url(#a-mint)"/><text x="40" y="4" class="d">Listening</text>
    <path d="M120 0H150" class="edge blue" marker-end="url(#a-blue)"/><text x="160" y="4" class="d">Finding songs</text>
    <path d="M270 0H300" class="edge amber" marker-end="url(#a-amber)"/><text x="310" y="4" class="d">Downloading to the library</text>
    <path d="M500 0H530" class="edge grey" marker-end="url(#a-grey)"/><text x="540" y="4" class="d">The app itself</text>
  </g>
</svg>
